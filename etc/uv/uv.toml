# User-level uv configuration, linked to ~/.config/uv/uv.toml.

# Use only uv's own Python builds, never Homebrew's or the system's. With the
# default ("managed") uv falls back to any system Python that satisfies the
# request, and a venv built on Homebrew's python@3.X breaks when Homebrew
# removes that version; uv's builds stay until 'uv python uninstall', and a
# venv links to the minor version, so patch upgrades do not break it either.
# They also ship root certificates, which Python.org's macOS installer does not.
python-preference = "only-managed"
