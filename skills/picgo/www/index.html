<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1113" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>picgo</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f3;
        --fg: #14171a;
        --muted: #6b7178;
        --card: #ffffff;
        --line: #e4e4df;
        --line-strong: #cdcdc6;
        --accent: #2563eb;
        --accent-fg: #ffffff;
        --accent-soft: rgb(37 99 235 / 0.09);
        --danger: #b3261e;
        --media: #0b0d0f;
        --radius: 16px;
        --radius-sm: 10px;
        --shadow: 0 1px 2px rgb(15 18 20 / 0.04),
          0 12px 28px -18px rgb(15 18 20 / 0.35);
        --shadow-lift: 0 2px 4px rgb(15 18 20 / 0.05),
          0 18px 36px -20px rgb(15 18 20 / 0.4);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1113;
          --fg: #eef0f2;
          --muted: #99a1ab;
          --card: #171a1e;
          --line: #262b31;
          --line-strong: #3a4149;
          --accent: #7ea6ff;
          --accent-fg: #06101f;
          --accent-soft: rgb(126 166 255 / 0.14);
          --danger: #ff8a80;
          --shadow: 0 1px 2px rgb(0 0 0 / 0.4),
            0 16px 32px -20px rgb(0 0 0 / 0.8);
          --shadow-lift: 0 2px 6px rgb(0 0 0 / 0.5),
            0 22px 44px -22px rgb(0 0 0 / 0.9);
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 0 1rem max(1.5rem, env(safe-area-inset-bottom));
        -webkit-font-smoothing: antialiased;
      }
      body:has(dialog[open]) {
        overflow: hidden;
      }
      main {
        max-width: 64rem;
        margin: 0 auto;
      }
      .vh {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: max(0.55rem, env(safe-area-inset-top)) 0 0.7rem;
        margin-bottom: 0.75rem;
        background: var(--bg);
      }
      @supports (backdrop-filter: blur(8px)) {
        header {
          background: color-mix(in srgb, var(--bg) 82%, transparent);
          -webkit-backdrop-filter: blur(12px);
          backdrop-filter: blur(12px);
        }
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 0.8rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .count {
        margin-left: auto;
        color: var(--muted);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
      }
      .count:empty {
        display: none;
      }
      .icon {
        display: inline-grid;
        place-items: center;
        width: 2.25rem;
        height: 2.25rem;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .icon:hover {
        background: var(--accent-soft);
        color: var(--fg);
      }
      .icon:disabled {
        opacity: 0.3;
        cursor: default;
        background: transparent;
        color: var(--muted);
      }
      .icon svg {
        width: 1.15rem;
        height: 1.15rem;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .upload {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem;
        margin-bottom: 0.9rem;
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius);
        background: var(--card);
        transition: border-color 0.15s ease, background-color 0.15s ease;
      }
      .upload.busy {
        pointer-events: none;
        opacity: 0.85;
      }
      .upload.dragging {
        border-color: var(--accent);
        border-style: solid;
        background: var(--accent-soft);
      }
      .upload .hint {
        padding-left: 0.15rem;
        color: var(--muted);
        font-size: 0.8rem;
      }
      @media (hover: none) {
        .upload .hint {
          display: none;
        }
      }
      .upload:has(#camera:focus-visible) label[for="camera"],
      .upload:has(#files:focus-visible) label[for="files"] {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .bar {
        flex-basis: 100%;
        height: 4px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
        display: none;
      }
      .bar.on {
        display: block;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: var(--accent);
        transition: width 140ms linear;
      }
      .status {
        flex-basis: 100%;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .status:empty {
        display: none;
      }
      .status.error {
        color: var(--danger);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.5rem 0.8rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--card);
        color: var(--fg);
        font: inherit;
        font-size: 0.85rem;
        font-weight: 550;
        text-decoration: none;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }
      .btn:hover {
        border-color: var(--line-strong);
        background: color-mix(in srgb, var(--card) 88%, var(--fg));
      }
      .btn.primary {
        border-color: transparent;
        background: var(--accent);
        color: var(--accent-fg);
      }
      .btn.primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, var(--fg));
      }
      .btn.ghost {
        padding: 0.3rem 0.45rem;
        border-color: transparent;
        background: transparent;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .btn.ghost:hover {
        border-color: var(--line);
        background: transparent;
        color: var(--fg);
      }
      .btn.ghost.danger:hover {
        border-color: color-mix(in srgb, var(--danger) 40%, transparent);
        color: var(--danger);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(
          auto-fill,
          minmax(clamp(9.5rem, 24vw, 15rem), 1fr)
        );
        gap: 0.85rem;
        grid-auto-rows: 8px;
        align-items: start;
      }
      .grid.solo {
        grid-template-columns: minmax(0, 32rem);
        justify-content: center;
      }
      .tile {
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow);
      }
      @media (hover: hover) {
        .tile {
          transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .tile:hover {
          transform: translateY(-2px);
          box-shadow: var(--shadow-lift);
        }
      }
      .media {
        position: relative;
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: var(--media);
        aspect-ratio: var(--ratio, 4 / 3);
        cursor: zoom-in;
        overflow: hidden;
      }
      .media img,
      .media video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      .media:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      .badge {
        position: absolute;
        top: 0.45rem;
        left: 0.45rem;
        padding: 0.1rem 0.4rem;
        border-radius: 999px;
        background: rgb(0 0 0 / 0.6);
        color: #fff;
        font-size: 0.62rem;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
      }
      .badge.latest {
        left: auto;
        right: 0.45rem;
        background: var(--accent);
        color: var(--accent-fg);
      }
      .caption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.4rem;
        padding: 0.45rem 0.6rem 0.5rem;
      }
      .time {
        font-size: 0.8rem;
        font-weight: 600;
      }
      .size {
        color: var(--muted);
        font-size: 0.72rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .empty {
        display: grid;
        place-items: center;
        gap: 0.6rem;
        padding: 3.5rem 1rem;
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius);
        color: var(--muted);
        text-align: center;
      }
      .empty[hidden] {
        display: none;
      }
      .empty svg {
        width: 2.4rem;
        height: 2.4rem;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.6;
      }
      .empty p {
        margin: 0;
        font-size: 0.86rem;
        line-height: 1.55;
      }
      .empty strong {
        color: var(--fg);
        font-weight: 600;
      }
      .empty .btn {
        margin-top: 0.3rem;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: max(1rem, env(safe-area-inset-bottom));
        z-index: 60;
        max-width: calc(100% - 2rem);
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        background: var(--fg);
        color: var(--bg);
        font-size: 0.8rem;
        text-align: center;
        box-shadow: var(--shadow-lift);
        opacity: 0;
        transform: translate(-50%, 1.5rem);
        transition: opacity 0.18s ease, transform 0.18s ease;
        pointer-events: none;
      }
      .toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .toast.bad {
        background: var(--danger);
        color: #fff;
      }

      dialog {
        margin: auto;
        padding: 0;
        border: 0;
        color: var(--fg);
        background: var(--card);
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.62);
        -webkit-backdrop-filter: blur(3px);
        backdrop-filter: blur(3px);
      }
      .viewer {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        margin: 0;
      }
      .viewer[open] {
        display: flex;
        flex-direction: column;
      }
      .viewer .tools {
        display: flex;
        align-items: center;
        gap: 0.15rem;
        padding: max(0.4rem, env(safe-area-inset-top)) 0.5rem 0.4rem;
        border-bottom: 1px solid var(--line);
      }
      .viewer .tools .grow {
        flex: 1;
      }
      #v-copy {
        min-width: 4.3rem;
        justify-content: center;
      }
      .viewer .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        background: #000;
      }
      .viewer .stage img,
      .viewer .stage video {
        position: absolute;
        inset: 0;
        margin: auto;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
      }
      .viewer .info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
        padding: 0.5rem 0.75rem max(0.55rem, env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.76rem;
      }
      .viewer .info .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 0 0.75rem;
      }
      .viewer .info .id {
        max-width: 100%;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.7rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (min-width: 700px) {
        .viewer {
          width: min(94vw, 80rem);
          height: min(92vh, 60rem);
          border-radius: var(--radius);
          box-shadow: 0 40px 90px -40px #000;
        }
      }

      .sheet {
        width: min(92vw, 22rem);
        border-radius: 14px;
        box-shadow: 0 30px 60px -30px #000;
      }
      .sheet[open] {
        display: block;
      }
      .sheet .body {
        padding: 1rem 1rem 0.25rem;
      }
      .sheet h2 {
        margin: 0 0 0.3rem;
        font-size: 1rem;
        font-weight: 650;
      }
      .sheet p {
        margin: 0;
        color: var(--muted);
        font-size: 0.84rem;
        line-height: 1.5;
      }
      .sheet .row {
        display: flex;
        justify-content: flex-end;
        gap: 0.4rem;
        padding: 0.85rem 1rem 1rem;
      }
      .sheet .btn.danger {
        border-color: transparent;
        background: var(--danger);
        color: #fff;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <h1>picgo</h1>
          <p>the last ten images and videos</p>
        </div>
        <span class="count" id="count"></span>
        <button class="icon" id="refresh" type="button" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3.2-6.9" />
            <path d="M21 4v5h-5" />
          </svg>
        </button>
      </header>

      <section class="upload" id="drop">
        <label class="btn primary" for="camera">Take photo</label>
        <label class="btn" for="files">Choose files</label>
        <span class="hint">or drop them here</span>
        <input class="vh" id="camera" type="file" accept="image/*" capture="environment" />
        <input class="vh" id="files" type="file" accept="image/*,video/*" multiple />
        <div class="bar" id="bar"><span id="fill"></span></div>
        <div class="status" id="status" role="status"></div>
      </section>

      <section class="grid" id="grid"></section>

      <div class="empty" id="empty" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2a2 2 0 0 0 1.7-1l.5-.8A2 2 0 0 1 10.6 3h2.8a2 2 0 0 1 1.7 1l.5.8a2 2 0 0 0 1.7 1h1.2A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z" />
          <circle cx="12" cy="12.5" r="3.5" />
        </svg>
        <p><strong>Nothing here yet.</strong><br />Take a photo or choose a file.</p>
      </div>
    </main>

    <dialog class="viewer" id="viewer" aria-label="Media viewer">
      <div class="tools">
        <button class="icon" id="v-newer" type="button" aria-label="Newer" title="Newer (left arrow)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" />
          </svg>
        </button>
        <button class="icon" id="v-older" type="button" aria-label="Older" title="Older (right arrow)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 5l7 7-7 7" />
          </svg>
        </button>
        <span class="grow"></span>
        <button class="btn ghost" id="v-copy" type="button">Copy ID</button>
        <a class="btn ghost" id="v-open" href="#" target="_blank" rel="noopener">Open</a>
        <button class="btn ghost danger" id="v-delete" type="button">Delete</button>
        <button class="icon" id="v-close" type="button" aria-label="Close" title="Close (Esc)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="stage" id="v-stage"></div>
      <div class="info" id="v-info"></div>
    </dialog>

    <dialog class="sheet" id="confirm" aria-labelledby="confirm-title">
      <div class="body">
        <h2 id="confirm-title">Delete this item?</h2>
        <p id="confirm-text">It cannot be recovered.</p>
      </div>
      <div class="row">
        <button class="btn" id="confirm-cancel" type="button">Cancel</button>
        <button class="btn danger" id="confirm-ok" type="button">Delete</button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      "use strict";

      const api = "/api/media";
      const networkHint =
        "Network or session error; reload, sign in, then retry.";
      const maxItems = 10;

      const grid = document.getElementById("grid");
      const empty = document.getElementById("empty");
      const drop = document.getElementById("drop");
      const files = document.getElementById("files");
      const camera = document.getElementById("camera");
      const statusEl = document.getElementById("status");
      const bar = document.getElementById("bar");
      const fill = document.getElementById("fill");
      const countEl = document.getElementById("count");
      const toastEl = document.getElementById("toast");
      const viewer = document.getElementById("viewer");
      const stage = document.getElementById("v-stage");
      const info = document.getElementById("v-info");
      const newer = document.getElementById("v-newer");
      const older = document.getElementById("v-older");
      const vCopy = document.getElementById("v-copy");
      const vOpen = document.getElementById("v-open");
      const vDelete = document.getElementById("v-delete");
      const confirmEl = document.getElementById("confirm");
      const confirmText = document.getElementById("confirm-text");
      const confirmOk = document.getElementById("confirm-ok");

      let items = [];
      let shown = -1;
      let busy = false;
      let toastTimer = 0;
      let copyTimer = 0;
      let layoutFrame = 0;

      function say(text, bad) {
        statusEl.textContent = text;
        statusEl.classList.toggle("error", Boolean(bad));
      }

      function toast(text, bad) {
        toastEl.textContent = text;
        toastEl.classList.toggle("bad", Boolean(bad));
        toastEl.classList.add("on");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2600);
      }

      function bytes(n) {
        const units = ["B", "KiB", "MiB", "GiB"];
        let v = Number(n);
        let i = 0;
        while (v >= 1024 && i < units.length - 1) {
          v /= 1024;
          i += 1;
        }
        return (i === 0 ? v.toFixed(0) : v.toFixed(1)) + " " + units[i];
      }

      function when(iso) {
        return new Date(iso).toLocaleString(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        });
      }

      function ago(iso) {
        const minutes = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
        if (minutes < 1) return "just now";
        if (minutes < 60) return minutes + " min ago";
        const hours = Math.round(minutes / 60);
        if (hours < 24) return hours + " h ago";
        const days = Math.round(hours / 24);
        if (days < 7) return days + " d ago";
        return new Date(iso).toLocaleDateString(undefined, {
          day: "numeric",
          month: "short",
        });
      }

      function mediaUrl(id) {
        return api + "/" + encodeURIComponent(id);
      }

      function detail(item) {
        if (item.width && item.height) return item.width + "×" + item.height;
        return (item.mime_type || "").split("/")[1] || item.kind;
      }

      function badge(text, latest) {
        const span = document.createElement("span");
        span.className = latest ? "badge latest" : "badge";
        span.textContent = text;
        return span;
      }

      function tile(item, latest) {
        const figure = document.createElement("figure");
        figure.className = "tile";

        const media = document.createElement("button");
        media.type = "button";
        media.className = "media";
        media.setAttribute(
          "aria-label",
          "Open " + item.kind + ", " + ago(item.created_at)
        );
        if (item.width && item.height) {
          media.style.setProperty("--ratio", item.width + " / " + item.height);
        }
        media.addEventListener("click", () => showItem(items.indexOf(item)));

        if (item.kind === "video") {
          const video = document.createElement("video");
          video.src = mediaUrl(item.id);
          video.muted = true;
          video.playsInline = true;
          video.preload = "metadata";
          video.tabIndex = -1;
          video.setAttribute("aria-hidden", "true");
          video.addEventListener("loadedmetadata", () => {
            if (video.videoWidth) {
              media.style.setProperty(
                "--ratio",
                video.videoWidth + " / " + video.videoHeight
              );
            }
            layout();
          });
          media.append(video, badge("video"));
        } else {
          const img = document.createElement("img");
          img.src = mediaUrl(item.id);
          img.alt = "";
          img.loading = "lazy";
          img.decoding = "async";
          img.addEventListener("load", () => {
            if (img.naturalWidth) {
              media.style.setProperty(
                "--ratio",
                img.naturalWidth + " / " + img.naturalHeight
              );
            }
            layout();
          });
          media.append(img);
        }
        if (latest) media.prepend(badge("latest", true));

        const caption = document.createElement("figcaption");
        caption.className = "caption";
        const time = document.createElement("span");
        time.className = "time";
        time.textContent = ago(item.created_at);
        time.title = when(item.created_at);
        const size = document.createElement("span");
        size.className = "size";
        size.textContent = bytes(item.bytes);
        caption.append(time, size);

        figure.append(media, caption);
        return figure;
      }

      function layout() {
        cancelAnimationFrame(layoutFrame);
        layoutFrame = requestAnimationFrame(() => {
          if (!grid.children.length) return;
          const styles = getComputedStyle(grid);
          const rows = parseFloat(styles.gridAutoRows) || 8;
          const gap = parseFloat(styles.rowGap) || 0;
          for (const figure of grid.children) {
            const height = figure.getBoundingClientRect().height;
            const span = Math.max(1, Math.ceil((height + gap) / (rows + gap)));
            const value = "span " + span;
            if (figure.style.gridRowEnd !== value) {
              figure.style.gridRowEnd = value;
            }
          }
        });
      }

      function render() {
        grid.replaceChildren(...items.map((item, i) => tile(item, i === 0)));
        grid.classList.toggle("solo", items.length === 1);
        empty.hidden = items.length > 0;
        if (!items.length) empty.replaceChildren(...emptyBody());
        countEl.textContent = items.length ? items.length + "/" + maxItems : "";
        layout();
      }

      function emptyBody() {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute(
          "d",
          "M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2a2 2 0 0 0 1.7-1l.5-.8A2 2 0 0 1 10.6 3h2.8a2 2 0 0 1 1.7 1l.5.8a2 2 0 0 0 1.7 1h1.2A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"
        );
        const circle = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );
        circle.setAttribute("cx", "12");
        circle.setAttribute("cy", "12.5");
        circle.setAttribute("r", "3.5");
        svg.append(path, circle);
        const text = document.createElement("p");
        const lead = document.createElement("strong");
        lead.textContent = "Nothing here yet.";
        text.append(lead, document.createElement("br"), "Take a photo or choose a file.");
        return [svg, text];
      }

      function showError(message) {
        grid.replaceChildren();
        empty.hidden = false;
        empty.replaceChildren();
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "M12 8v5m0 3.5v.5M12 3l9 17H3z");
        svg.append(path);
        const text = document.createElement("p");
        text.textContent = message;
        const retry = document.createElement("button");
        retry.type = "button";
        retry.className = "btn";
        retry.textContent = "Try again";
        retry.addEventListener("click", load);
        empty.append(svg, text, retry);
      }

      async function load() {
        const viewing = viewer.open && shown >= 0 ? items[shown].id : null;
        try {
          const response = await fetch(api, {
            headers: { accept: "application/json" },
          });
          if (!response.ok) throw new Error("HTTP " + response.status);
          const data = await response.json();
          items = data.items;
          render();
          if (viewing) {
            const index = items.findIndex((item) => item.id === viewing);
            if (index >= 0) showItem(index);
            else viewer.close();
          }
        } catch (error) {
          const reason =
            error instanceof TypeError ? networkHint : error.message;
          if (viewer.open) viewer.close();
          showError("Cannot load: " + reason);
          countEl.textContent = "";
        }
      }

      async function copyId(id, button) {
        const original = button.textContent;
        try {
          await navigator.clipboard.writeText(id);
          button.textContent = "Copied";
        } catch {
          button.textContent = "Copy failed";
        }
        clearTimeout(copyTimer);
        copyTimer = setTimeout(() => {
          button.textContent = original;
        }, 1500);
      }

      function ask(question) {
        confirmText.textContent = question;
        confirmEl.showModal();
        return new Promise((resolve) => {
          let answer = false;
          confirmOk.onclick = () => {
            answer = true;
            confirmEl.close();
          };
          confirmEl.addEventListener("close", () => resolve(answer), {
            once: true,
          });
        });
      }

      async function remove(id) {
        const yes = await ask(
          "Delete " + id + "? It cannot be recovered."
        );
        if (!yes) return;
        try {
          const response = await fetch(mediaUrl(id), { method: "DELETE" });
          if (!response.ok) throw new Error("HTTP " + response.status);
          if (viewer.open) viewer.close();
          toast("Deleted.");
          await load();
        } catch (error) {
          toast("Delete failed: " + error.message, true);
        }
      }

      function showItem(index) {
        if (index < 0 || index >= items.length) return;
        shown = index;
        const item = items[index];
        stage.replaceChildren();
        if (item.kind === "video") {
          const video = document.createElement("video");
          video.src = mediaUrl(item.id);
          video.controls = true;
          video.playsInline = true;
          stage.append(video);
        } else {
          const img = document.createElement("img");
          img.src = mediaUrl(item.id);
          img.alt = "";
          stage.append(img);
        }
        newer.disabled = index <= 0;
        older.disabled = index >= items.length - 1;
        info.replaceChildren();
        const facts = document.createElement("div");
        facts.className = "facts";
        for (const text of [when(item.created_at), bytes(item.bytes), detail(item)]) {
          const span = document.createElement("span");
          span.textContent = text;
          facts.append(span);
        }
        const id = document.createElement("span");
        id.className = "id";
        id.textContent = item.id;
        id.title = item.id;
        info.append(facts, id);
        vOpen.href = mediaUrl(item.id);
        if (!viewer.open) viewer.showModal();
      }

      function send(file) {
        return new Promise((resolve, reject) => {
          const request = new XMLHttpRequest();
          request.open("POST", api);
          request.setRequestHeader(
            "Content-Type",
            file.type || "application/octet-stream"
          );
          request.setRequestHeader(
            "X-Picgo-Filename",
            encodeURIComponent(file.name)
          );
          request.upload.addEventListener("progress", (event) => {
            if (event.lengthComputable) {
              fill.style.width =
                Math.round((event.loaded / event.total) * 100) + "%";
            }
          });
          request.addEventListener("load", () => {
            if (request.status >= 200 && request.status < 300) {
              resolve();
            } else {
              let problem = request.statusText;
              try {
                problem = JSON.parse(request.responseText).error || problem;
              } catch {}
              reject(new Error(problem || "HTTP " + request.status));
            }
          });
          request.addEventListener("error", () =>
            reject(new Error(networkHint))
          );
          request.send(file);
        });
      }

      async function upload(list) {
        const chosen = [...list].filter(
          (file) =>
            file.type.startsWith("image/") ||
            file.type.startsWith("video/") ||
            /\.(jpe?g|png|gif|webp|heic|heif|avif|mp4|m4v|mov|webm|3gp)$/i.test(
              file.name
            )
        );
        if (chosen.length === 0) {
          say("Choose an image or a video.", true);
          return;
        }
        busy = true;
        drop.classList.add("busy");
        bar.classList.add("on");
        fill.style.width = "0";
        try {
          for (let i = 0; i < chosen.length; i += 1) {
            say("Uploading " + (i + 1) + " of " + chosen.length + "…");
            await send(chosen[i]);
            fill.style.width = "0";
          }
          say("");
          toast(
            chosen.length === 1
              ? "Uploaded."
              : "Uploaded " + chosen.length + " items."
          );
          await load();
        } catch (error) {
          say("Upload failed: " + error.message, true);
        } finally {
          busy = false;
          drop.classList.remove("busy");
          bar.classList.remove("on");
          files.value = "";
          camera.value = "";
        }
      }

      camera.addEventListener("change", () => upload(camera.files));
      files.addEventListener("change", () => upload(files.files));
      for (const name of ["dragenter", "dragover"]) {
        drop.addEventListener(name, (event) => {
          event.preventDefault();
          drop.classList.add("dragging");
        });
      }
      for (const name of ["dragleave", "drop"]) {
        drop.addEventListener(name, (event) => {
          event.preventDefault();
          drop.classList.remove("dragging");
        });
      }
      drop.addEventListener("drop", (event) => upload(event.dataTransfer.files));
      window.addEventListener("dragover", (event) => event.preventDefault());
      window.addEventListener("drop", (event) => event.preventDefault());
      window.addEventListener("resize", layout);

      document.getElementById("refresh").addEventListener("click", load);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && !busy) load();
      });

      newer.addEventListener("click", () => showItem(shown - 1));
      older.addEventListener("click", () => showItem(shown + 1));
      vCopy.addEventListener("click", () => {
        if (shown >= 0) copyId(items[shown].id, vCopy);
      });
      vDelete.addEventListener("click", () => {
        if (shown >= 0) remove(items[shown].id);
      });
      document.getElementById("v-close").addEventListener("click", () =>
        viewer.close()
      );
      viewer.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          showItem(shown - 1);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          showItem(shown + 1);
        }
      });
      viewer.addEventListener("click", (event) => {
        if (event.target === viewer) viewer.close();
      });
      viewer.addEventListener("close", () => {
        stage.replaceChildren();
        shown = -1;
      });
      document
        .getElementById("confirm-cancel")
        .addEventListener("click", () => confirmEl.close());
      confirmEl.addEventListener("click", (event) => {
        if (event.target === confirmEl) confirmEl.close();
      });

      load();
    </script>
  </body>
</html>
