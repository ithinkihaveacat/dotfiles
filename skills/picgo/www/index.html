<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111417" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>picgo</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f4;
        --fg: #17191c;
        --muted: #6b7078;
        --card: #ffffff;
        --line: #d9dce1;
        --accent: #2864dc;
        --danger: #b42525;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111417;
          --fg: #f0f2f4;
          --muted: #9aa1ab;
          --card: #1a1e23;
          --line: #2b3037;
          --accent: #7aa2ff;
          --danger: #ff8181;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: max(1rem, env(safe-area-inset-top)) 1rem
          max(1rem, env(safe-area-inset-bottom));
      }
      main {
        max-width: 60rem;
        margin: 0 auto;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.6rem;
        letter-spacing: -0.02em;
        margin: 0;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.85rem;
      }
      .upload {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .upload.dragging {
        border-color: var(--accent);
        outline: 2px dashed var(--accent);
        outline-offset: -6px;
      }
      .upload label {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        padding: 0.65rem 1rem;
        border-radius: 0.6rem;
        font-weight: 600;
        cursor: pointer;
      }
      .upload input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .upload .hint {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .bar {
        flex-basis: 100%;
        height: 0.35rem;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
        display: none;
      }
      .bar.on {
        display: block;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 120ms linear;
      }
      .status {
        flex-basis: 100%;
        min-height: 1.3rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .status.error {
        color: var(--danger);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
        gap: 0.9rem;
      }
      figure {
        margin: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .frame {
        background: #000;
        aspect-ratio: 4 / 3;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .frame img,
      .frame video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      figcaption {
        padding: 0.6rem 0.7rem 0.7rem;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .kind {
        color: var(--fg);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
      }
      .actions {
        display: flex;
        gap: 0.4rem;
        margin-top: 0.45rem;
      }
      button {
        font: inherit;
        font-size: 0.8rem;
        padding: 0.3rem 0.55rem;
        border-radius: 0.45rem;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--muted);
      }
      button.danger {
        color: var(--danger);
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 3rem 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>picgo</h1>
        <p>the last ten images and videos</p>
      </header>

      <section class="card upload" id="drop">
        <label for="pick">Take or choose a photo or video</label>
        <input id="pick" type="file" accept="image/*,video/*" multiple />
        <span class="hint">or drop files here</span>
        <div class="bar" id="bar"><span id="fill"></span></div>
        <div class="status" id="status"></div>
      </section>

      <section class="grid" id="grid" aria-live="polite"></section>
    </main>

    <script>
      "use strict";
      const api = "/api/media";
      const grid = document.getElementById("grid");
      const drop = document.getElementById("drop");
      const pick = document.getElementById("pick");
      const status = document.getElementById("status");
      const bar = document.getElementById("bar");
      const fill = document.getElementById("fill");

      function say(text, bad) {
        status.textContent = text;
        status.classList.toggle("error", Boolean(bad));
      }

      function bytes(n) {
        const units = ["B", "KiB", "MiB", "GiB"];
        let v = Number(n);
        let i = 0;
        while (v >= 1024 && i < units.length - 1) {
          v /= 1024;
          i += 1;
        }
        return (i === 0 ? v.toFixed(0) : v.toFixed(1)) + " " + units[i];
      }

      function when(iso) {
        return new Date(iso).toLocaleString(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        });
      }

      function mediaUrl(id) {
        return api + "/" + encodeURIComponent(id);
      }

      function itemEl(item) {
        const figure = document.createElement("figure");
        figure.className = "card";

        const frame = document.createElement("div");
        frame.className = "frame";
        if (item.kind === "video") {
          const video = document.createElement("video");
          video.src = mediaUrl(item.id);
          video.controls = true;
          video.preload = "metadata";
          video.playsInline = true;
          frame.append(video);
        } else {
          const img = document.createElement("img");
          img.src = mediaUrl(item.id);
          img.alt = item.kind + " uploaded " + when(item.created_at);
          img.loading = "lazy";
          frame.append(img);
        }

        const caption = document.createElement("figcaption");
        const row = document.createElement("div");
        row.className = "row";
        const kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = item.kind;
        const size = document.createElement("span");
        size.textContent = bytes(item.bytes);
        row.append(kind, size);

        const meta = document.createElement("div");
        meta.textContent =
          when(item.created_at) +
          (item.width ? " · " + item.width + "×" + item.height : "");

        const actions = document.createElement("div");
        actions.className = "actions";
        const copy = document.createElement("button");
        copy.type = "button";
        copy.textContent = "Copy ID";
        copy.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(item.id);
            say("Copied " + item.id);
          } catch {
            say(item.id);
          }
        });
        const del = document.createElement("button");
        del.type = "button";
        del.className = "danger";
        del.textContent = "Delete";
        del.addEventListener("click", () => remove(item.id));
        actions.append(copy, del);

        caption.append(row, meta, actions);
        figure.append(frame, caption);
        return figure;
      }

      async function load() {
        try {
          const response = await fetch(api, { headers: { accept: "application/json" } });
          if (!response.ok) throw new Error("HTTP " + response.status);
          const data = await response.json();
          grid.replaceChildren(...data.items.map(itemEl));
          if (data.items.length === 0) {
            const empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = "Nothing yet. Take a photo or choose a file.";
            grid.append(empty);
          }
        } catch (error) {
          say("Cannot load: " + error.message, true);
        }
      }

      function send(file) {
        return new Promise((resolve, reject) => {
          const request = new XMLHttpRequest();
          request.open("POST", api);
          request.setRequestHeader(
            "Content-Type",
            file.type || "application/octet-stream"
          );
          request.setRequestHeader("X-Picgo-Filename", encodeURIComponent(file.name));
          request.upload.addEventListener("progress", (event) => {
            if (event.lengthComputable) {
              fill.style.width = Math.round((event.loaded / event.total) * 100) + "%";
            }
          });
          request.addEventListener("load", () => {
            if (request.status >= 200 && request.status < 300) {
              resolve();
            } else {
              let detail = request.statusText;
              try {
                detail = JSON.parse(request.responseText).error || detail;
              } catch {}
              reject(new Error(detail || "HTTP " + request.status));
            }
          });
          request.addEventListener("error", () => reject(new Error("network error")));
          request.send(file);
        });
      }

      async function upload(files) {
        const chosen = [...files].filter(
          (file) => file.type.startsWith("image/") || file.type.startsWith("video/") || /\.(jpe?g|png|gif|webp|heic|heif|avif|mp4|m4v|mov|webm|3gp)$/i.test(file.name)
        );
        if (chosen.length === 0) {
          say("Choose an image or a video.", true);
          return;
        }
        bar.classList.add("on");
        fill.style.width = "0";
        pick.disabled = true;
        try {
          for (let i = 0; i < chosen.length; i += 1) {
            say("Uploading " + (i + 1) + " of " + chosen.length + "…");
            await send(chosen[i]);
            fill.style.width = "0";
          }
          say(chosen.length === 1 ? "Uploaded." : "Uploaded " + chosen.length + " items.");
          await load();
        } catch (error) {
          say("Upload failed: " + error.message, true);
        } finally {
          pick.disabled = false;
          bar.classList.remove("on");
          pick.value = "";
        }
      }

      async function remove(id) {
        if (!confirm("Delete " + id + "?")) return;
        try {
          const response = await fetch(mediaUrl(id), { method: "DELETE" });
          if (!response.ok) throw new Error("HTTP " + response.status);
          say("Deleted.");
          await load();
        } catch (error) {
          say("Delete failed: " + error.message, true);
        }
      }

      pick.addEventListener("change", () => upload(pick.files));
      for (const name of ["dragenter", "dragover"]) {
        drop.addEventListener(name, (event) => {
          event.preventDefault();
          drop.classList.add("dragging");
        });
      }
      for (const name of ["dragleave", "drop"]) {
        drop.addEventListener(name, (event) => {
          event.preventDefault();
          drop.classList.remove("dragging");
        });
      }
      drop.addEventListener("drop", (event) => upload(event.dataTransfer.files));
      load();
    </script>
  </body>
</html>
