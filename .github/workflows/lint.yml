name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    # Same-repo PRs are already covered by the push event; only fork PRs
    # (which do not trigger push here) need the pull_request run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install shfmt and shellcheck
        run: |
          SHFMT_VERSION="v3.10.0"
          sudo curl -sSLo /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

          SC_VERSION="v0.11.0"
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz" | tar -xJ -C /tmp
          sudo cp "/tmp/shellcheck-${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: ruff
        run: |
          grep -rlE '^#!.*python|^#!/usr/bin/env -S uv run' bin/ skills/*/scripts/ \
            | grep -v '__pycache__' \
            | sort \
            | xargs -r skills/coding-standards/scripts/python-format --check

      - name: shellcheck
        run: |
          grep -rlE '^#!.*\bba?sh\b' bin/ skills/*/scripts/ etc/macos/apply-defaults install.sh \
            | grep -v '__pycache__' \
            | sort \
            | xargs shellcheck

      - name: shfmt
        run: |
          grep -rlE '^#!.*\bba?sh\b' bin/ skills/*/scripts/ etc/macos/apply-defaults install.sh \
            | grep -v '__pycache__' \
            | sort \
            | xargs shfmt -d -i 2 -ci

  test:
    # Same-repo PRs are already covered by the push event; only fork PRs
    # (which do not trigger push here) need the pull_request run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils

          SHFMT_VERSION="v3.10.0"
          sudo curl -sSLo /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

          SC_VERSION="v0.11.0"
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz" | tar -xJ -C /tmp
          sudo cp "/tmp/shellcheck-${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck

          # Pre-warm uv dependencies before parallel test execution
          skills/workspace-config/scripts/skill --help >/dev/null 2>&1 || true

      - name: Run tests
        env:
          # Empty key forces heavy, non-deterministic external LLM tests to skip gracefully.
          GEMINI_API_KEY: ""
        run: prove -j $(nproc) tests/test-* skills/*/tests/test-*
