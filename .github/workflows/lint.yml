name: lint

on:
  push:
  pull_request:

env:
  # Supply-chain cooldown: uv and uvx ignore packages published in the last
  # week. Exact pins (e.g. in shell-format and python-format) must be at least
  # this old, or resolving them fails.
  UV_EXCLUDE_NEWER: "7 days"

jobs:
  lint:
    # Same-repo PRs are already covered by the push event; only fork PRs
    # (which do not trigger push here) need the pull_request run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: ruff
        run: |
          grep -rlE '^#!.*python|^#!/usr/bin/env -S uv run' bin/ skills/*/scripts/ tests/ skills/*/tests/ \
            | grep -v '__pycache__' \
            | grep -v 'fixtures/' \
            | sort \
            | xargs -r skills/coding-standards/scripts/python-format --check

      - name: shell-format
        run: |
          grep -rlE '^#!.*\bba?sh\b' bin/ skills/*/scripts/ tests/ skills/*/tests/ etc/macos/apply-defaults install.sh \
            | grep -v '__pycache__' \
            | grep -v 'fixtures/' \
            | sort \
            | xargs -r skills/coding-standards/scripts/shell-format --check

      - name: markdown-format
        run: |
          git ls-files '*.md' \
            | grep -v 'fixtures/' \
            | sort \
            | xargs -r skills/coding-standards/scripts/markdown-format --check

      - name: command-index-format
        run: bin/command-index-format --check --all

  test:
    # Same-repo PRs are already covered by the push event; only fork PRs
    # (which do not trigger push here) need the pull_request run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils fish

      - name: Prefetch uv-managed tools
        # Warms every uv dependency the tests need, so they can run with
        # UV_OFFLINE below; a test that needs something not prefetched fails.
        run: bin/prefetch-tools

      - name: Run tests
        env:
          # Empty key forces heavy, non-deterministic external LLM tests to skip gracefully.
          GEMINI_API_KEY: ""
          # Enforce hermetic offline execution across all cached repo tools.
          AGENT_OFFLINE: "1"
          # uv resolves and installs from the prefetched cache only.
          UV_OFFLINE: "1"
        run: prove -j 4 tests/test-* skills/*/tests/test-*
